[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-extract-py"
version = "0.1.0"
description = "A Python port of the pgn-extract tool using Ports and Adapters architecture."
authors = [
    { name = "David J. Barnes", email = "d.j.barnes@kent.ac.uk" },
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Chess",
]
dependencies = [
    "python-chess>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.0.280",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://www.cs.kent.ac.uk/people/staff/djb/pgn-extract/"
Repository = "https://github.com/kentdjb/pgn-extract.git"

[project.scripts]
pgn-extract-py = "pgn.adapters.cli_adapter:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "B", "I"]